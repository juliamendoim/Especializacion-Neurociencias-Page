site_name: Apuntes — Especialización en Neurociencias del Lenguaje
site_description: Apuntes y aprendizajes transversales de la Especialización en Neurociencias Cognitivas del Lenguaje y la Lectura (UBA). Contenido producido en diálogo con Claude (LLM) y curado humanamente.
site_author: Julia Milanese
repo_url: https://github.com/juliamendoim/Especializacion-Neurociencias-Page
repo_name: juliamendoim/Especializacion-Neurociencias-Page

copyright: 'Contenido producido en diálogo con <strong>Claude (Anthropic)</strong> y curado por Julia Milanese. Verificá con fuentes primarias antes de citar.'

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang: es
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

extra_javascript:
  - javascripts/goatcounter.js

nav:
  - Inicio: index.md
  - Estadística:
    - estadistica/index.md
    - t de Student: estadistica/t-de-student.md
    - Chi cuadrado: estadistica/chi-cuadrado.md
    - Efecto techo: estadistica/efecto-techo.md
    - Media y desvío: estadistica/media-y-desvio.md
  - Modelos cognitivos:
    - modelos-cognitivos/index.md
    - Buffer fonológico: modelos-cognitivos/buffer-fonologico.md
    - Memoria de trabajo: modelos-cognitivos/memoria-trabajo.md
    - Recuperación de memoria (voluntaria/involuntaria): modelos-cognitivos/recuperacion-memoria.md
    - Modelo dual-ruta: modelos-cognitivos/dual-ruta-lectura.md
    - Activación: modelos-cognitivos/activacion.md
    - Garden paths: modelos-cognitivos/garden-paths.md
    - Surprisal: modelos-cognitivos/surprisal.md
  - Neurobiología:
    - neurobiologia/index.md
    - Las 4 preguntas de Tinbergen: neurobiologia/tinbergen-niveles-analisis.md
    - Bottom-up vs. top-down: neurobiologia/bottom-up-top-down.md
    - Bases físico-químicas: neurobiologia/bases-fisicoquimicas.md
    - Marr — modelo computacional de la visión: neurobiologia/marr-vision-computacional.md
    - Sincitio y doctrina neurona: neurobiologia/sincitio.md
    - Plasticidad — experimentos fundacionales: neurobiologia/plasticidad-experimentos-fundacionales.md
    - Ontogenia y filogenia: neurobiologia/ontogenia-filogenia.md
    - Mecanismos de recuperación post-lesión: neurobiologia/mecanismos-recuperacion-post-lesion.md
    - Plasticidad estructural y sináptica: neurobiologia/plasticidad-estructural-mecanismos.md
    - Neuronas tipo ensamble: neurobiologia/neuronas-ensamble.md
    - FOXP2: neurobiologia/foxp2.md
  - Evaluación:
    - evaluacion/index.md
    - ITPA: evaluacion/itpa.md
    - K-BIT: evaluacion/kbit.md
    - WISC-V: evaluacion/wisc-v.md
    - CELF: evaluacion/celf.md
    - TROG: evaluacion/trog.md
    - CEG: evaluacion/ceg.md
    - ECENI: evaluacion/eceni.md
    - Repetición de pseudopalabras: evaluacion/repeticion-pseudopalabras.md
  - Medidas lingüísticas:
    - medidas-linguisticas/index.md
    - Unidades-t y cláusulas: medidas-linguisticas/unidades-t-y-clausulas.md
  - Lingüística:
    - tipologia/index.md
    - Español como lengua fusional: tipologia/espanol-fusional.md
  - TDL:
    - tdl/index.md
    - Etiología multifactorial: tdl/etiologia-multifactorial.md
  - Metodología:
    - metodologia/index.md
    - PRISMA: metodologia/prisma.md
    - CATALISE: metodologia/catalise.md
    - MeSH: metodologia/mesh.md
