<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Diagrama del hemisferio izquierdo cerebral mostrando el corredor perisilviano continuo (Broca, arcuato, Wernicke, giros supramarginal y angular), las zonas watershed extrasilvianas asociadas a las afasias transcorticales, y los territorios vasculares de las arterias cerebrales anterior, media y posterior">
<defs>
<pattern id="watershed-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="#1565C0" stroke-width="1.4"/>
</pattern>
<marker id="callout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
</marker>
</defs>
<rect x="0" y="0" width="800" height="560" fill="white"/>

<text x="400" y="26" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Corredor perisilviano, zonas watershed y territorios vasculares</text>
<text x="400" y="44" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-style="italic">Hemisferio izquierdo, vista lateral — organización anatómica de las afasias corticales</text>

<text x="90" y="75" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">← anterior</text>
<text x="700" y="75" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">posterior →</text>

<g opacity="0.42">
<path d="M 100 240 C 95 160, 160 90, 300 85 C 360 82, 395 85, 400 100 C 402 135, 350 168, 285 178 C 220 183, 150 200, 105 225 Z"
      fill="#CE93D8"/>
<path d="M 545 105 C 578 108, 610 132, 628 172 C 645 215, 638 268, 615 295 C 592 315, 560 320, 535 305 C 548 258, 550 200, 545 105 Z"
      fill="#81D4FA"/>
<path d="M 100 250 C 105 275, 130 295, 165 310 C 210 335, 285 355, 380 355 C 470 355, 530 335, 555 305 C 505 320, 425 328, 340 320 C 240 310, 155 288, 100 250 Z"
      fill="#FFF176"/>
</g>

<path d="M 100 240 C 95 160, 160 90, 300 85 C 440 80, 570 100, 620 165 C 645 220, 635 275, 595 305 C 555 325, 470 345, 370 358 C 275 362, 200 348, 160 315 C 130 290, 105 260, 100 240 Z"
      fill="none" stroke="#333" stroke-width="2.5"/>

<path d="M 180 260 C 260 245, 380 245, 500 250" stroke="#666" stroke-width="1.8" stroke-dasharray="5,3" fill="none"/>
<text x="330" y="242" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle" font-style="italic">cisura de Silvio</text>

<path d="M 215 205
         C 260 190, 335 195, 405 200
         C 465 205, 505 220, 525 245
         L 530 275
         C 500 295, 445 302, 385 302
         C 320 302, 265 295, 235 280
         L 220 260
         C 210 240, 208 220, 215 205 Z"
      fill="#FF9800" fill-opacity="0.32" stroke="#E65100" stroke-width="2"/>

<circle cx="240" cy="225" r="13" fill="#E65100"/>
<text x="240" y="229" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">B</text>

<circle cx="470" cy="275" r="13" fill="#1B5E20"/>
<text x="470" y="279" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">W</text>

<circle cx="445" cy="220" r="11" fill="#F57C00"/>
<text x="445" y="223" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">GSM</text>

<circle cx="510" cy="240" r="11" fill="#EF6C00"/>
<text x="510" y="243" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="700">GA</text>

<path d="M 415 245 C 375 175, 300 175, 265 210" stroke="#5E35B1" stroke-width="2.5" fill="none" marker-end="url(#callout-arrow)"/>
<text x="335" y="180" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#4527A0" text-anchor="middle" font-weight="600" font-style="italic">fascículo arcuato</text>

<ellipse cx="220" cy="130" rx="55" ry="24" fill="url(#watershed-hatch)" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="220" y="127" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#0D47A1" text-anchor="middle" font-weight="700">watershed</text>
<text x="220" y="140" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="#0D47A1" text-anchor="middle" font-style="italic">ACA ↔ ACM</text>

<ellipse cx="565" cy="145" rx="55" ry="22" fill="url(#watershed-hatch)" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="565" y="143" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#0D47A1" text-anchor="middle" font-weight="700">watershed</text>
<text x="565" y="156" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="#0D47A1" text-anchor="middle" font-style="italic">ACM ↔ ACP</text>

<line x1="220" y1="154" x2="220" y2="180" stroke="#555" stroke-width="1"/>
<text x="220" y="172" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle" font-style="italic">→ transcortical motora</text>

<line x1="565" y1="167" x2="565" y2="195" stroke="#555" stroke-width="1"/>
<text x="565" y="187" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle" font-style="italic">→ transcortical sensorial</text>

<g transform="translate(45, 395)">
<rect x="0" y="0" width="710" height="150" fill="#FAFAFA" stroke="#CCC" stroke-width="1" rx="4"/>

<text x="12" y="20" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11" fill="#222" font-weight="700">Referencias</text>

<rect x="12" y="32" width="22" height="14" fill="#CE93D8" opacity="0.55" stroke="#7B1FA2" stroke-width="0.8"/>
<text x="40" y="43" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">ACA — arteria cerebral anterior (parasagital, frontal medial)</text>

<rect x="12" y="52" width="22" height="14" fill="#FFF176" opacity="0.55" stroke="#F9A825" stroke-width="0.8"/>
<text x="40" y="63" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">ACM — arteria cerebral media (lateral, perisilviana, mayor territorio del lenguaje)</text>

<rect x="12" y="72" width="22" height="14" fill="#81D4FA" opacity="0.55" stroke="#0288D1" stroke-width="0.8"/>
<text x="40" y="83" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">ACP — arteria cerebral posterior (occipital, temporal inferior)</text>

<rect x="12" y="92" width="22" height="14" fill="#FF9800" opacity="0.32" stroke="#E65100" stroke-width="1.5"/>
<text x="40" y="103" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333"><tspan font-weight="700">Corredor perisilviano</tspan> — banda continua alrededor de la cisura de Silvio; contiene TODA la maquinaria del lenguaje clásico</text>

<rect x="12" y="112" width="22" height="14" fill="url(#watershed-hatch)" stroke="#1565C0" stroke-width="0.8" stroke-dasharray="3,2"/>
<text x="40" y="123" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333"><tspan font-weight="700">Zonas watershed extrasilvianas</tspan> — fronteras entre territorios vasculares; caen aquí las <tspan font-style="italic">afasias transcorticales</tspan></text>

<text x="12" y="141" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#555" font-style="italic">Abreviaturas: B = Broca, W = Wernicke, GSM = giro supramarginal (BA 40), GA = giro angular (BA 39)</text>
</g>
</svg>
