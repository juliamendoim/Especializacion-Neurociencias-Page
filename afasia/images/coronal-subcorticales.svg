<text x="112" y="345" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="#5D4037" text-anchor="end" font-style="italic">ínsula</text>

<path d="M 100 340 C 115 348, 130 350, 148 348" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
<text x="95" y="365" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="9" fill="#666" text-anchor="end" font-style="italic">cisura de Silvio</text>

<g font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">

<line x1="240" y1="200" x2="215" y2="185" stroke="#666" stroke-width="1"/>
<text x="212" y="182" font-size="10" fill="#4527A0" text-anchor="end" font-weight="600">núcleo caudado (cabeza)</text>

<line x1="275" y1="230" x2="330" y2="200" stroke="#666" stroke-width="1"/>
<text x="333" y="197" font-size="10" fill="#0277BD" font-weight="600">ventrículo lateral</text>

<line x1="200" y1="290" x2="80" y2="270" stroke="#666" stroke-width="1"/>
<text x="78" y="267" font-size="10" fill="#1B5E20" text-anchor="end" font-weight="600">putamen</text>

<line x1="255" y1="295" x2="80" y2="405" stroke="#666" stroke-width="1"/>
<text x="78" y="410" font-size="10" fill="#1B5E20" text-anchor="end" font-weight="600">globo pálido</text>

<line x1="300" y1="272" x2="260" y2="130" stroke="#B8860B" stroke-width="1.3"/>
<text x="257" y="120" font-size="11" fill="#B8860B" text-anchor="end" font-weight="700">cápsula interna</text>
<text x="257" y="132" font-size="9" fill="#B8860B" text-anchor="end" font-style="italic">brazo anterior</text>

<line x1="312" y1="292" x2="220" y2="405" stroke="#B8860B" stroke-width="1.3"/>
<text x="216" y="412" font-size="9" fill="#B8860B" text-anchor="end" font-style="italic">rodilla</text>

<line x1="316" y1="330" x2="360" y2="440" stroke="#B8860B" stroke-width="1.3"/>
<text x="364" y="447" font-size="9" fill="#B8860B" text-anchor="start" font-style="italic">brazo posterior</text>

<line x1="345" y1="305" x2="378" y2="405" stroke="#666" stroke-width="1"/>
<text x="380" y="418" font-size="10" fill="#4527A0" font-weight="600">tálamo</text>

<line x1="185" y1="285" x2="60" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
<text x="58" y="215" font-size="10" fill="#666" text-anchor="end" font-style="italic">sustancia blanca</text>
<text x="58" y="226" font-size="10" fill="#666" text-anchor="end" font-style="italic">periventricular</text>

</g>

<g font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#666" opacity="0.55">
<ellipse cx="600" cy="290" rx="35" ry="42" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1.5" opacity="0.65"/>
<path d="M 565 275 L 535 275 L 530 305 L 560 315 L 568 300 Z"
      fill="#66BB6A" stroke="#1B5E20" stroke-width="1.3" opacity="0.65"/>
<path d="M 525 260 L 500 260 L 490 285 L 485 340 L 500 345 L 505 305 L 520 285 Z"
      fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5" opacity="0.65"/>
<ellipse cx="455" cy="305" rx="35" ry="30" fill="#B39DDB" stroke="#4527A0" stroke-width="1.5" opacity="0.65"/>
<path d="M 560 215 C 540 200, 520 200, 525 210 L 535 235 L 560 235 Z"
      fill="#D1C4E9" stroke="#5E35B1" stroke-width="1.3" opacity="0.65"/>
</g>

<g transform="translate(45, 490)">
<rect x="0" y="0" width="710" height="60" fill="#FAFAFA" stroke="#CCC" stroke-width="1" rx="4"/>

<circle cx="15" cy="18" r="6" fill="#D1C4E9" stroke="#5E35B1"/>
<circle cx="15" cy="38" r="6" fill="#B39DDB" stroke="#4527A0"/>
<text x="26" y="22" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">caudado / tálamo (materia gris subcortical medial)</text>
<text x="26" y="42" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">→ afasia talámica: parafasias, fluencia reducida, comprensión relativamente preservada</text>

<rect x="250" y="12" width="12" height="12" fill="#A5D6A7" stroke="#2E7D32"/>
<rect x="250" y="32" width="12" height="12" fill="#66BB6A" stroke="#1B5E20"/>
<text x="268" y="22" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">putamen + globo pálido = núcleo lentiforme (lateral)</text>
<text x="268" y="42" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">→ afasia estriato-capsular: hemiparesia + habla lentificada + parafasias</text>

<rect x="510" y="12" width="12" height="12" fill="#FFFDE7" stroke="#F9A825"/>
<rect x="510" y="32" width="12" height="12" fill="url(#periventricular)" stroke="#888"/>
<text x="528" y="22" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">cápsula interna (autopista de fibras)</text>
<text x="528" y="42" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#333">sustancia blanca periventricular</text>
</g>
</svg>
