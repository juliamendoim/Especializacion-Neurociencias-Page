<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Corte coronal esquemático del cerebro a nivel de los ganglios basales, mostrando núcleo caudado, putamen, globo pálido, tálamo, cápsula interna con sus tres partes (brazo anterior, rodilla, brazo posterior), sustancia blanca periventricular y ventrículos laterales">
<defs>
<pattern id="periventricular" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#BBB" stroke-width="1"/>
</pattern>
<marker id="cap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
</marker>
</defs>
<rect x="0" y="0" width="800" height="560" fill="white"/>

<text x="400" y="26" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Corte coronal — ganglios basales, tálamo y cápsula interna</text>
<text x="400" y="44" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-style="italic">Nivel aproximado del cuerpo del ventrículo lateral — dónde caen las afasias subcorticales</text>

<text x="120" y="72" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle" font-style="italic">hemisferio izquierdo</text>
<text x="680" y="72" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle" font-style="italic">hemisferio derecho</text>

