         L 315 340
         L 300 345
         L 295 305
         L 280 285 Z"
      fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/>

<ellipse cx="345" cy="305" rx="35" ry="30" fill="#B39DDB" stroke="#4527A0" stroke-width="1.5"/>

